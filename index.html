<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dial de acceso rápido</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232b2d33'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23e4e5e8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="viewport">
    <!-- El escalador ajusta el escenario fijo (900x540) al tamaño de la ventana -->
    <div class="stage-scaler" id="scaler">
      <div class="stage" id="stage">
        <div class="scene" id="scene">
          <div class="halo"></div>

          <header class="head">
            <h1>Personaliza tu Dial</h1>
            <p id="headHint">Gira el dial para elegir un acceso rápido.</p>
          </header>

          <!-- Anillo con segmentos + perilla central -->
          <div class="dial" id="dial">
            <svg class="ring" id="ring" viewBox="0 0 400 400" width="400" height="400" aria-hidden="true">
              <defs>
                <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                  <rect width="5" height="5" fill="#3b3d44"/>
                  <line x1="0" y1="0" x2="0" y2="5" stroke="#4b4e56" stroke-width="2.4"/>
                </pattern>
                <!-- Difuminado del halo; región en coordenadas del SVG para que no se recorte al arco fino -->
                <filter id="glowBlur" filterUnits="userSpaceOnUse" x="240" y="90" width="140" height="220">
                  <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="near"/>
                  <feGaussianBlur in="SourceGraphic" stdDeviation="11" result="far"/>
                  <feMerge>
                    <feMergeNode in="far"/>
                    <feMergeNode in="far"/>
                    <feMergeNode in="near"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
                <radialGradient id="trackGrad" cx="50%" cy="50%" r="50%">
                  <stop offset="70%" stop-color="#25272c"/>
                  <stop offset="100%" stop-color="#1e2024"/>
                </radialGradient>
              </defs>
              <circle class="ring-track" cx="200" cy="200" r="194"/>
              <g id="segments"></g>
              <path id="highlight" class="highlight"/>
              <g id="icons"></g>
              <circle class="recess" cx="200" cy="200" r="114"/>
              <path id="activeGlow" class="active-glow"/>
            </svg>

            <div class="knob" id="knob" role="slider" tabindex="0"
                 aria-label="Dial de opciones" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0">
              <div class="knob-ridges" id="ridges"></div>
              <div class="knob-face"><span data-icon="menu"></span></div>
            </div>
          </div>

          <!-- Línea que une el segmento activo con la opción activa -->
          <svg class="connector" viewBox="0 0 900 540" width="900" height="540" aria-hidden="true">
            <path id="connectorPath"/>
            <circle id="connectorDot" r="2.5"/>
          </svg>

          <ul class="options" id="options" role="listbox" aria-label="Opciones del dial"></ul>

          <aside class="controls">
            <button class="ctl-round" id="btnClose" aria-label="Volver a la opción inicial" data-icon="x"></button>
            <div class="ctl-pill">
              <button id="btnUp" aria-label="Opción anterior" data-icon="up"></button>
              <button id="btnOpen" aria-label="Abrir opción" data-icon="square"></button>
              <button id="btnDown" aria-label="Opción siguiente" data-icon="down"></button>
            </div>
          </aside>
        </div>
      </div>

      <!-- Panel de contenido de la opción (fuera del escenario para poder pasar debajo en móvil) -->
      <section class="panel" id="panel" role="region" aria-live="polite" aria-labelledby="panelTitle">
        <header class="panel-head">
          <span class="panel-ico" id="panelIcon"></span>
          <div>
            <h2 id="panelTitle"></h2>
            <p id="panelDesc"></p>
          </div>
        </header>
        <div class="panel-body" id="panelBody"></div>
      </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
